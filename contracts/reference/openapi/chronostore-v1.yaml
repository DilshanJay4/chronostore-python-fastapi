        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: ["Admin: Shipments"]
      operationId: updateShipmentStatus
      summary: Update shipment status and tracking events (Admin only)
      description: |
        Transitions shipment status:
        - `pending -> dispatched`: Decrements both `on_hand` and `reserved` inventory, transitions order to `shipped`.
        - `dispatched -> delivered`: Transitions order to `delivered`.
        - `dispatched -> failed`: Transitions order to `delivery_failed`.
        - `failed -> returned`: Restocks `on_hand` inventory and cancels the order.
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentStatusUpdateRequest"
