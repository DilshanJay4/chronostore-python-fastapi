components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          tokenUrl: /api/v1/auth/login
          scopes: {}

  headers:
    XRequestId:
      description: Correlation ID for request tracing
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access/refresh token
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Authenticated user lacks required role or resource ownership
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Requested resource was not found
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Conflict with current state of the resource or duplicate unique key
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ValidationError:
      description: Request payload validation or business rule violation
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    RateLimited:
      description: Rate limit exceeded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ServiceUnavailable:
      description: Database or migration readiness check failed
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    MoneyAmount:
      type: string
      format: decimal
      pattern: '^\d+\.\d{2}$'
      description: Monetary amount in LKR formatted with exactly 2 decimal places
      examples: ["125000.00"]

    MoneyInput:
      oneOf:
        - type: number
          exclusiveMinimum: 0
        - type: string
          pattern: '^\d+(\.\d{1,2})?$'

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          type: string
          enum: [LKR]

    UserRole:
      type: string
      enum: [customer, admin]

    WatchMovement:
      type: string
      enum: [quartz, automatic, manual]

    ProductStatus:
      type: string
      enum: [draft, published, discontinued]

    StockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]

    InventoryMovementType:
      type: string
      enum:
        - adjustment
        - reservation
        - reservation_release
        - dispatch
        - return_to_sender_restock
        - return_restock

    AdjustmentReason:
      type: string
      enum: [restock, damage, loss, count_correction, other]

    OrderStatus:
      type: string
