openapi: 3.1.0
info:
  title: ChronoStore API
  version: 1.0.0
  summary: Canonical REST API contract for ChronoStore (Sri Lankan Wristwatch E-Commerce Platform)
  description: |
    **ChronoStore** is an online wristwatch store serving customers across **Sri Lanka**.
    This canonical OpenAPI 3.1.0 specification defines the exact request/response contracts,
    authentication schemes, business validation rules, and error formats that all five
    ChronoStore backend implementations must satisfy:
    - `chronostore-python-fastapi` (Python / FastAPI)
    - `chronostore-java-spring-boot` (Java / Spring Boot)
    - `chronostore-dotnet-aspnet-core` (C# / ASP.NET Core)
    - `chronostore-node-express` (TypeScript / Node.js + Express)
    - `chronostore-php-laravel` (PHP / Laravel)

    ### Core Conventions
    * **Currency & Monetary Amounts:** Exclusively `LKR`. All monetary amounts are serialized as fixed 2-decimal strings (`"125000.00"`).
    * **Timestamps:** Timezone-aware UTC in ISO 8601 format (`2026-11-11T10:00:00Z`).
    * **Errors:** RFC 9457 Problem Details (`application/problem+json`) with stable machine-readable `code` and `request_id`.
    * **Correlation:** Every response carries an `X-Request-ID` header.
    * **Payment Model:** Cash on Delivery (`cash_on_delivery`) with explicit collection lifecycle.
  contact:
    name: ChronoStore Architecture Team
    url: https://chronostore.lk

servers:
  - url: http://localhost:8000
    description: Local Docker development server

tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Auth
    description: Registration, login, and token lifecycle.
  - name: Users
    description: Authenticated user's profile and delivery addresses.
  - name: Brands
    description: Watch brands catalog.
  - name: Categories
    description: Product categories catalog.
  - name: Products
    description: Wristwatch catalog with search, filtering, sorting, and pagination.
  - name: Cart
    description: Authenticated customer's shopping cart.
  - name: Checkout
    description: Idempotent order placement from the cart.
  - name: Orders
    description: Customer order history, cancellation, and payment status.
  - name: Shipments
    description: Shipment tracking for customers.
  - name: Returns
    description: Customer return requests.
  - name: "Admin: Orders"
    description: Order confirmation, cancellation, and COD collection.
  - name: "Admin: Inventory"
    description: Stock levels, adjustments, and movement ledger.
  - name: "Admin: Shipments"
    description: Fulfillment and shipment status changes.
  - name: "Admin: Returns"
    description: Return review, receipt, inspection, restocking, and refund.
  - name: "Admin: Reports"
    description: Sales, order, best-seller, and inventory reporting.
  - name: "Admin: Audit"
    description: Audit trail of sensitive operations.

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: healthLive
      summary: Liveness probe
      description: Reports that the process is running. Performs no dependency checks.
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
              example:
                status: ok

  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      summary: Readiness probe
      description: Reports whether the service can handle traffic (database reachable and migrations at head).
      responses:
        "200":
          description: Service is ready
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ready
                checks:
                  database: ok
                  migrations: ok
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new customer account
      description: Creates a new `customer` account with an initialized empty shopping cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterRequest"
      responses:
        "201":
          description: Customer registered
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Login to obtain access and refresh tokens
      description: Accepts either `application/json` (`email`, `password`) or OAuth2 `application/x-www-form-urlencoded` (`username`, `password`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuth2PasswordFormRequest"
      responses:
        "200":
          description: Access and refresh tokens issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate refresh token and issue new access token
      description: Revokes the presented refresh token and issues a new token pair. Reusing an already-revoked token triggers replay detection and revokes all active refresh tokens for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Rotated token pair
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Refresh token revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get current user profile
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      responses:
        "200":
          description: Current user profile
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Update current user profile
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user profile
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/users/me/addresses:
    get:
      tags: [Users]
      operationId: listMyAddresses
      summary: List saved customer delivery addresses
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      responses:
        "200":
          description: List of saved addresses
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      operationId: createMyAddress
      summary: Add a new delivery address
      description: First address for a user is automatically marked `is_default = true`. Marking a new address as default unsets the previous default address.
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressCreate"
      responses:
        "201":
          description: Created delivery address
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/users/me/addresses/{address_id}:
    parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Users]
      operationId: updateMyAddress
      summary: Update a saved address
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressUpdate"
      responses:
        "200":
          description: Updated address
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Users]
      operationId: deleteMyAddress
      summary: Delete a saved address
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      responses:
        "204":
          description: Address deleted
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/brands:
    get:
      tags: [Brands]
      operationId: listBrands
      summary: List watch brands
      parameters:
        - name: include_inactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of watch brands ordered by name
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandResponse"
    post:
      tags: [Brands]
      operationId: createBrand
      summary: Create a new brand (Admin only)
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCreate"
      responses:
        "201":
          description: Created brand
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/brands/{brand_id}:
    parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Brands]
      operationId: getBrand
      summary: Get brand details
      responses:
        "200":
          description: Brand details
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Brands]
      operationId: updateBrand
      summary: Update a brand (Admin only)
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated brand
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories
      parameters:
        - name: include_inactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of categories ordered by name
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category (Admin only)
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created category
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get category details
      responses:
        "200":
          description: Category details
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Update a category (Admin only)
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List and filter wristwatch products
      description: Public callers see only `published` products. Authenticated admins can filter by `status` and receive `available_stock`.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Case-insensitive search across name, SKU, model, and description
          schema:
            type: string
        - name: brand_id
          in: query
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: movement_type
          in: query
          schema:
            $ref: "#/components/schemas/WatchMovement"
        - name: min_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, price_asc, price_desc, name_asc, name_desc]
            default: created_at
      responses:
        "200":
          description: Paginated wristwatch catalog
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a new wristwatch product (Admin only)
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Created wristwatch product with initialized inventory
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/products/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get wristwatch product details
      responses:
        "200":
          description: Wristwatch product details
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Update a wristwatch product (Admin only)
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated wristwatch product
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get current customer's shopping cart
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      responses:
        "200":
          description: Customer shopping cart with server-calculated LKR totals
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Clear all items from the shopping cart
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      responses:
        "204":
          description: Cart cleared
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add an item to the shopping cart
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemAddRequest"
      responses:
        "201":
          description: Updated cart after adding item
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/cart/items/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: Update quantity of an item in the shopping cart
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdateRequest"
      responses:
        "200":
          description: Updated cart
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove an item from the shopping cart
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      responses:
        "200":
          description: Updated cart after item removal
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/checkout:
    post:
      tags: [Checkout]
      operationId: checkoutCart
      summary: Checkout from customer cart with idempotency support
      description: |
        Atomically locks inventory rows (`SELECT ... FOR UPDATE`), verifies stock availability,
        creates an order with snapshotted address and line items, reserves stock, creates a
        `pending` Cash on Delivery payment record, and clears the cart.
        If `Idempotency-Key` is replayed with the same payload, returns `200 OK` with header
        `Idempotent-Replayed: true`. Reusing the same `Idempotency-Key` with a different
        payload returns `409 Conflict`.
      security:
        - BearerAuth: []
        - OAuth2PasswordBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional client-generated idempotency key (max 128 chars)
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
