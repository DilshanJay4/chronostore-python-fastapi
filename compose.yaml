# Local development stack. Production should use managed PostgreSQL, real secrets
# from a secret manager and a TLS-terminating reverse proxy (see README).
name: chronostore

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chronostore}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-chronostore}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "true"
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  DOCS_ENABLED: ${DOCS_ENABLED:-true}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronostore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chronostore}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to localhost only; host port 5433 avoids clashing with a local PostgreSQL.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *api-env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:

