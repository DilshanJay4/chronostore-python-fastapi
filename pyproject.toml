[project]
name = "chronostore-api"
version = "1.0.0"
description = "ChronoStore API - production-oriented REST API for a Sri Lankan online wristwatch store."
authors = [{ name = "Dilshan Jayawardana" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1,<2",
    "email-validator>=2.3.0,<3",
    "fastapi>=0.162,<1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-instrumentation-system-metrics>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.8,<4",
    "pwdlib[argon2]>=0.3.1,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16.2,<3",
    "pyjwt>=2.15.1,<3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1,<2.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: tests that require the PostgreSQL test database",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # The spec mandates HTTPX; Starlette now recommends its `httpx2` fork but supports both.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]
